name: Purge AI Fingerprints

on:
  push:
    branches:
      - main

jobs:
  clean-artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Remove Claude Artifacts
        run: |
          echo "Scanning for AI fingerprints..."
          rm -rf CLAUDE.md .claude/
          
          # Check if any files were actually deleted or modified
          if git status --porcelain | grep -q .; then
            echo "Artifacts found. Purging and updating history..."
            git config --global user.name "github-actions[bot]"
            git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
            
            git add -A
            git commit -m "chore: automated purge of AI configuration residues"
            git push origin main --force
          else
            echo "No AI fingerprints detected. Repository is clean."
          /fi
